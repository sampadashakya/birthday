<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Birthday Scene</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Moving GIFs -->
<img src="GIS/clouds.gif" class="layer clouds">
<img src="GIS/grass.gif" class="layer grass">
<img src="GIS/butterflies.gif" class="layer butterflies">
<img src="GIS/birds.gif" class="layer birds">
<img src="GIS/windchime.gif" class="layer windchime">

<!-- Text overlay -->
<div class="scene-text">
    <h1>Welcome to our little world</h1>
</div>

<!-- Background music -->
<audio autoplay loop>
    <source src="music/music.mp3" type="audio/mpeg">
</audio>

<script src="script.js"></script>
</body>
</html>
